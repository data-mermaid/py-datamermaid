name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `--strict` turns a broken link, an orphaned page or a cross-reference to
      # a symbol that no longer exists into a failure, so a pull request that
      # breaks the docs cannot merge.
      - name: Build the site
        run: uv run --group docs mkdocs build --strict

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pages allows one deployment at a time, and a half-finished one must not be
    # cancelled, so this job opts out of the workflow's cancelling group.
    concurrency:
      group: pages
      cancel-in-progress: false
    # `deploy-pages` needs to write the Pages deployment and to mint an OIDC
    # token to prove the artifact came from this run.
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
