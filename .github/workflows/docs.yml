name: Docs

# The site is published only when a release tag is pushed, like the package in
# `release.yml`, so the docs always match the latest release. Pull requests
# still build the site to catch broken docs before they merge.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
  workflow_dispatch:

# Superseded pull request builds are worth cancelling; a release run is not,
# because cancelling it here would take the deploy job down with it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Packed into `docs/` rather than into `site/`: `mkdocs build` cleans the
      # site directory first, so anything copied there beforehand is deleted.
      # MkDocs copies non-Markdown files out of `docs/` verbatim, which puts the
      # pack at <site>/repomix-output.xml for agents to fetch directly. The file
      # is git-ignored, and `repomix.config.json` ignores `repomix-output.*`, so
      # a pack is never committed and never packs a previous pack.
      - name: Pack the repository for LLMs
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx -y repomix@1 --output docs/repomix-output.xml

      # `--strict` turns a broken link, an orphaned page or a cross-reference to
      # a symbol that no longer exists into a failure, so a pull request that
      # breaks the docs cannot merge.
      - name: Build the site
        run: uv run --group docs mkdocs build --strict

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pages allows one deployment at a time, so concurrent runs queue here rather
    # than race; a half-finished deployment is never cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    # `deploy-pages` needs to write the Pages deployment and to mint an OIDC
    # token to prove the artifact came from this run.
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
