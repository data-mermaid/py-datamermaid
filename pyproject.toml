[project]
name = "datamermaid"
version = "0.2.0"
description = "Python SDK for the MERMAID coral reef monitoring API"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "MERMAID" }]
keywords = ["mermaid", "coral", "reef", "api", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
# `client.covariates` reads the MERMAID STAC catalog with pystac-client.
covariates = ["pystac-client>=0.8"]

[project.urls]
Homepage = "https://datamermaid.org/"
Documentation = "https://data-mermaid.github.io/py-datamermaid/"
Repository = "https://github.com/data-mermaid/py-datamermaid"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datamermaid"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
    # `tomllib` is stdlib from 3.11; tests/test_examples.py reads the examples'
    # PEP 723 metadata and still has to run on 3.10.
    "tomli>=2.0; python_version < '3.11'",
]
# The documentation site, built with `uv run --group docs mkdocs build`.  Kept
# out of `dev` so the ordinary test loop does not install it.
docs = [
    # MkDocs 2.0 drops the plugin system that mkdocstrings needs.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# Marimo notebooks are generated files: every cell is an unannotated `def _()`
# whose last statement is a bare expression, which is how marimo knows what to
# display.
"examples/marimo/*" = ["ANN", "B018"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# pandas is an optional extra and its stubs pull in numpy's, which mypy cannot
# parse under `python_version = "3.10"`.  The SDK only touches pandas behind
# `TYPE_CHECKING`, so skipping it costs nothing.
[[tool.mypy.overrides]]
module = ["pandas.*"]
follow_imports = "skip"
ignore_missing_imports = true
